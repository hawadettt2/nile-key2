<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nile Key - منصة مفتاح النيل</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Stitch design canvas width — adjust this number until visual match is exact.
        // Example: if design looks too large, increase this number; if too small, decrease it.
        var STITCH_WIDTH = 1280;
        function applyStitchScale() {
          var scale = STITCH_WIDTH / window.innerWidth;
          document.body.style.zoom = scale;
        }
        applyStitchScale();
        window.addEventListener('resize', applyStitchScale);
      })();
    </script>
  </body>
</html>
