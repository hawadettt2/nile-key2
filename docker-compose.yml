services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=change-me-in-production
      - DATABASE_URL=sqlite:///./nile_key.db
      - ALLOWED_ORIGINS=["*"]
    volumes:
      - db-data:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
